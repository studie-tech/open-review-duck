services:
  database:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: reviewduck
      POSTGRES_PASSWORD: reviewduck
      POSTGRES_USER: reviewduck
    ports:
      - "127.0.0.1:${REVIEWDUCK_DEV_DATABASE_PORT:-55433}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewduck -d reviewduck"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

volumes:
  database:
