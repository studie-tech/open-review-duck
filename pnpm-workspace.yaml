packages:
  - "."
  - "docker/workflow-runtime"

injectWorkspacePackages: true

overrides:
  brace-expansion: 5.0.8
  effect: 3.20.0
  esbuild: 0.25.0
  fast-uri: 3.1.4
  postcss: 8.5.21
  sharp: 0.35.0

allowBuilds:
  "@google/genai": false
  "@mongodb-js/zstd": false
  "@sentry/cli": false
  "@swc/core": false
  "@tree-sitter-grammars/tree-sitter-hcl": false
  cbor-extract: false
  esbuild: true
  msgpackr-extract: false
  node-liblzma: false
  protobufjs: false
  sharp: true
  tree-sitter-bash: false
  tree-sitter-groovy: false
  tree-sitter-html: false
  tree-sitter-java: false
  tree-sitter-julia: false
  tree-sitter-make: false
  tree-sitter-powershell: false
  typescript: true
  unrs-resolver: true
  workerd: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.31'
  - '@ai-sdk/openai@4.0.23'
  - '@aws-sdk/client-kms@3.1097.0'
  - '@aws-sdk/core@3.977.2'
