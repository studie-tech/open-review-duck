name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/open_review_duck
      MIGRATION_DATABASE_URL: postgresql://user:password@localhost:5432/open_review_duck
      DEPLOYMENT_MODE: local
      NEXT_PUBLIC_DEPLOYMENT_MODE: local
      ENCRYPTION_KEY: ci-only-encryption-key-with-at-least-32-characters
      STORAGE_ID_KEY: ci-only-storage-key-with-at-least-32-characters
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgresql://user:password@localhost:5432/open_review_duck
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: open_review_duck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d open_review_duck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm check
      - run: pnpm db:migrate
      - run: node scripts/setup-workflow.mjs
      - run: pnpm test:integration:coverage
      - run: pnpm db:generate
      - name: Verify committed baseline is current
        run: git diff --exit-code -- drizzle
      - name: Build local target
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm build
      - name: Build SaaS target
        env:
          DEPLOYMENT_MODE: saas
          NEXT_PUBLIC_DEPLOYMENT_MODE: saas
          SKIP_ENV_VALIDATION: "1"
        run: pnpm build

  local-container:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24
        with:
          cache-key: open-review-duck/local-appliance
      - name: Build the local appliance
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850
        with:
          context: .
          load: true
          tags: open-review-duck:ci
          platforms: linux/amd64
          provenance: false
          sbom: false
      - name: Scan the local appliance
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: open-review-duck:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Start with no configuration and no network
        run: >-
          docker run --detach --name reviewduck-ci --network none
          --volume reviewduck-ci-data:/data
          open-review-duck:ci
      - name: Verify offline startup, bootstrap, persistence, and boundaries
        run: |
          for attempt in $(seq 1 90); do
            if docker exec reviewduck-ci curl --fail --silent \
              http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if [ "$attempt" -eq 90 ]; then docker logs reviewduck-ci; exit 1; fi
            sleep 2
          done
          docker logs reviewduck-ci | grep -q "ACTION REQUIRED: AUTHORIZE YOUR BROWSER"
          test "$(docker exec reviewduck-ci curl --silent --output /dev/null \
            --write-out '%{http_code}' --header 'Host: reviewduck.example' \
            http://127.0.0.1:3000/dashboard)" = "403"
          docker restart reviewduck-ci
          for attempt in $(seq 1 60); do
            docker exec reviewduck-ci curl --fail --silent \
              http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 2
          done
      - name: Run the local appliance browser journey
        env:
          LOCAL_E2E_BASE_URL: http://127.0.0.1:3941
          LOCAL_E2E_CONTAINER: reviewduck-local-playwright
        run: |
          docker stop --timeout 35 reviewduck-ci
          docker rm reviewduck-ci
          docker run --detach --name reviewduck-local-playwright \
            --publish 127.0.0.1:3941:3000 \
            --volume reviewduck-ci-data:/data \
            open-review-duck:ci
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3941/api/health >/dev/null \
              && break
            if [ "$attempt" -eq 60 ]; then
              docker logs reviewduck-local-playwright
              exit 1
            fi
            sleep 2
          done
          pnpm test:e2e:local
          docker exec reviewduck-local-playwright reviewduck-local admin backup
          docker exec reviewduck-local-playwright reviewduck-local admin verify-backup
          docker exec reviewduck-local-playwright reviewduck-local admin export

  publish-container:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, local-container]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/studie-tech/open-review-duck
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: REVIEWDUCK_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - run: cosign sign --yes ghcr.io/studie-tech/open-review-duck@${{ steps.build.outputs.digest }}
