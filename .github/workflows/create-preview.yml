name: Create preview

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: create-preview-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/create-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: write
      deployments: read
    steps:
      # Only trusted default-branch code executes with credentials. The PR tree
      # is passed to Vercel through a Git ref, never checked out on this runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553
        env:
          PREVIEW_PUSH_TOKEN: ${{ secrets.PREVIEW_PUSH_TOKEN }}
        with:
          script: |
            const { runPreview } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/create-preview.mjs`);
            await runPreview({ github, context, core });
