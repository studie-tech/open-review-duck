name: Feature request
description: Propose a focused improvement to ReviewDuck
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the review problem first, then the smallest change that would
        solve it. Broader behavior or schema changes should be discussed before
        implementation begins.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: deployment
    attributes:
      label: Relevant deployment
      options:
        - Hosted and local
        - Hosted service
        - Local appliance
        - Not deployment-specific
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Relevant code provider
      options:
        - All providers
        - GitHub
        - GitLab
        - Azure DevOps
        - Not provider-specific
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: I have not included private source, credentials, or personal data.
          required: true
